name: Build Windows Installer

on:
  workflow_dispatch:
  push:
    branches: [ main, master ]
    tags: [ 'v*' ]

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install dependencies
        run: npm install

      # A version tag (for example v1.0.2) publishes a GitHub Release
      # containing the installer and latest.yml required by auto-updates.
      - name: Publish release for version tags
        if: startsWith(github.ref, 'refs/tags/v')
        run: npm run dist -- --publish always
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      # Normal commits still produce a downloadable Actions artifact.
      - name: Build installer for branch commits
        if: "!startsWith(github.ref, 'refs/tags/v')"
        run: npm run dist -- --publish never

      - name: Upload installer artifact
        if: "!startsWith(github.ref, 'refs/tags/v')"
        uses: actions/upload-artifact@v4
        with:
          name: Alfajar-Travel-Windows-Installer
          path: dist/*.exe
          if-no-files-found: error
